<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo frame</title>
<style>html,body{height:100%;margin:0;background:#0d0c0b;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;text-align:center}a{color:#fff}</style>
<script>
/* A frame set to beta updates while there is no beta copy lands here: switch it back to the normal version. */
(() => {
  const p = location.pathname, i = p.indexOf('/beta/');
  if(i < 0) return;
  try { const c = JSON.parse(localStorage.getItem('pf') || '{}'); c.channel = 'stable'; localStorage.setItem('pf', JSON.stringify(c)); } catch {}
  location.replace(p.slice(0, i + 1) + location.search + location.hash);
})();
</script>
</head>
<body><p>Page not found. <a href="/photo-frame/">Open the photo frame</a></p></body>
</html>
