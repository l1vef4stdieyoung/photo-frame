<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<title>photo-frame – discontinued</title>
<style>
:root{--bg:#0d0c0b;--ink:#f4f1ec;--soft:rgba(244,241,236,.62)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
main{max-width:46rem}
h1{font-weight:300;font-size:clamp(2rem,6vw,4.2rem);letter-spacing:-.03em;line-height:1.08;margin:0 0 1.2rem}
p{font-size:clamp(.95rem,1.8vw,1.15rem);line-height:1.55;color:var(--soft);margin:0}
a{color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>This project has been discontinued.</h1>
  <p>photo-frame has been deprecated and is no longer available to use. Look in the <a href="https://github.com/l1vef4stdieyoung/photo-frame/releases/tag/end-of-life" target="_blank" rel="noopener">release notes</a> for additional options.</p>
</main>
<script>
/* photo-frame is discontinued: remove the offline copy of the old frame, so nothing can show it again */
(() => {
  try { if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); } catch {}
  try { if(window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))); } catch {}
})();
</script>
</body>
</html>
